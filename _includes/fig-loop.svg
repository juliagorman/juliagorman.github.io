<svg class="fig" viewBox="0 0 620 290" role="img" aria-label="Diagram of a loop. A song reaches the brain through hearing and returns to the world through singing.">
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-a"/></marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-b"/></marker>
  </defs>
  <!-- the song -->
  <g class="f-ink" transform="translate(-2,22)">
    <rect x="62" y="117" width="4" height="16" rx="2"/><rect x="71" y="106" width="4" height="38" rx="2"/><rect x="80" y="96" width="4" height="58" rx="2"/><rect x="89" y="110" width="4" height="30" rx="2"/><rect x="98" y="119" width="4" height="12" rx="2"/><rect x="107" y="101" width="4" height="48" rx="2"/><rect x="116" y="89" width="4" height="72" rx="2"/><rect x="125" y="104" width="4" height="42" rx="2"/><rect x="134" y="114" width="4" height="22" rx="2"/><rect x="143" y="108" width="4" height="34" rx="2"/><rect x="152" y="119" width="4" height="12" rx="2"/>
  </g>
  <text x="107" y="212" text-anchor="middle" class="fig-strong">one song</text>
  <!-- the brain, outline only -->
  <g transform="translate(262,22) scale(1.1)">
    <path class="fig-brain" d="M42,148 C 12,110 30,40 110,22 C 180,6 250,30 266,82 C 271,98 268,110 258,118 C 282,116 300,134 294,158 C 290,176 272,186 256,182 C 262,198 266,212 262,224 C 252,232 236,232 228,224 C 222,206 208,186 186,178 C 150,168 72,180 42,148 Z"/>
    <path class="fig-brain fig-fold" d="M268,132 C 278,138 283,148 281,160"/>
    <path class="fig-brain fig-fold" d="M258,140 C 267,146 271,157 269,169"/>
  </g>
  <rect x="336" y="76" width="176" height="50" rx="25" class="fig-node s-a"/>
  <text x="424" y="98" text-anchor="middle" class="fig-strong">auditory forebrain</text>
  <text x="424" y="115" text-anchor="middle" class="fig-label">NCM · CMM</text>
  <rect x="336" y="140" width="176" height="50" rx="25" class="fig-node s-b"/>
  <text x="424" y="162" text-anchor="middle" class="fig-strong">song motor pathway</text>
  <text x="424" y="179" text-anchor="middle" class="fig-label">HVC · RA</text>
  <!-- hearing and singing -->
  <path d="M168,122 C 210,74 270,72 330,98" class="fig-line s-a" marker-end="url(#ah-a)"/>
  <text x="236" y="66" text-anchor="middle" class="fig-word t-a">hearing</text>
  <path d="M332,170 C 272,214 212,216 168,170" class="fig-line s-b" marker-end="url(#ah-b)"/>
  <text x="236" y="238" text-anchor="middle" class="fig-word t-b">singing</text>
</svg>
