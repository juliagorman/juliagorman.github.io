<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | strip }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body class="{{ page.layout }}">
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/research/' | relative_url }}"{% if page.url contains '/research/' %} class="active"{% endif %}>research</a>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.url contains '/teaching/' %} class="active"{% endif %}>teaching</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} class="active"{% endif %}>writing</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv/' %} class="active"{% endif %}>cv</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <span class="footer-links">
        <a href="mailto:jugorman@ucsd.edu">email</a>
        <a href="https://bsky.app/profile/{{ site.bluesky_username }}.bsky.social">bluesky</a>
        <a href="https://x.com/{{ site.twitter_username }}">x</a>
        <a href="{{ site.scholar_url }}">scholar</a>
      </span>
    </div>
  </footer>
</body>
</html>
